name: CodSpeed

on:
  push:
    branches:
      - main
    paths:
      - "litestar/**"
      - "tests/benchmarks/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/codspeed.yml"
  pull_request:
    paths:
      - "litestar/**"
      - "tests/benchmarks/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/codspeed.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codspeed-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_LOCKED: 1
  UV_PYTHON_PREFERENCE: only-system
  UV_PYTHON: "3.14"
  PYTHONHASHSEED: "0"
  GLIBC_TUNABLES: "glibc.cpu.hwcaps=-AVX512F,-AVX512VL,-AVX512BW,-ERMS,-FSRM:glibc.malloc.mmap_threshold=32768"

jobs:
  benchmarks:
    name: Run benchmarks
    if: github.repository == 'litestar-org/litestar'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install build dependencies
        run: sudo apt-get install build-essential libpq-dev python3-dev -y

      - name: Install dependencies
        run: uv sync --no-group docs --no-group linting

      - name: Check interpreter
        run: uv run --no-sync python -c "import sys; print(sys.version, sys.executable); assert sys.version_info[:2] == (3, 14), sys.version"

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5.6.0
        with:
          mode: simulation,memory
          run: uv run --no-sync pytest tests/benchmarks --codspeed -n 0

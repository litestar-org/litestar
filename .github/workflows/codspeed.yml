name: CodSpeed

on:
  push:
    branches:
      - main
  pull_request:
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  UV_LOCKED: 1

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install Build Dependencies
        run: sudo apt-get install build-essential libpq-dev python3-dev -y

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.8.8"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5.6.0
        with:
          mode: simulation
          run: uv run pytest tests/benchmarks --codspeed
